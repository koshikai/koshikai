name: Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - '.dockerignore'
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  APP_IMAGE_NAME: ${{ github.repository }}

jobs:
  # lint/test/audit
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Get Bun cache directory
        id: bun-cache
        run: echo "dir=$(bun pm cache)" >> $GITHUB_OUTPUT

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.bun-cache.outputs.dir }}
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Run tests
        run: bun run test --run

      - name: Detect lockfile changes
        id: lockfile-changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            lockfile:
              - 'bun.lock'
              - 'package.json'

      - name: Run security audit
        if: steps.lockfile-changes.outputs.lockfile == 'true' || github.event_name == 'workflow_dispatch'
        run: bun audit

  # アプリ用イメージ (常にビルド)
  build-app:
    name: Build App Image
    needs: lint-test
    if: needs.lint-test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract app metadata
        id: app_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.app_meta.outputs.tags }}
          labels: ${{ steps.app_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Proxmox
    needs: build-app
    if: always() && needs.build-app.result == 'success'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync deployment manifests
        run: |
          DEPLOY_DIR="${HOME}/deploy/koshikai"
          mkdir -p "$DEPLOY_DIR"
          cp docker-compose.prod.yaml "$DEPLOY_DIR/docker-compose.prod.yaml"

          if [ -f /opt/home/.env.prod ] && [ ! -e "$DEPLOY_DIR/.env.prod" ]; then
            ln -s /opt/home/.env.prod "$DEPLOY_DIR/.env.prod"
          fi

          echo "DEPLOY_DIR=$DEPLOY_DIR" >> "$GITHUB_ENV"

      - name: Pull and restart public portfolio
        run: |
          cd "$DEPLOY_DIR"
          if [ ! -f .env.prod ]; then
            echo "Missing .env.prod. Place it in /opt/home/.env.prod or $DEPLOY_DIR/.env.prod before deploying."
            exit 1
          fi
          PROJECT_NAME="koshikai_public"
          if docker inspect koshikai-app >/dev/null 2>&1; then
            CURRENT_PROJECT="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' koshikai-app 2>/dev/null || true)"
            if [ "$CURRENT_PROJECT" != "$PROJECT_NAME" ]; then
              echo "Removing legacy koshikai-app container from compose project '$CURRENT_PROJECT'."
              docker rm -f koshikai-app
            fi
          fi
          docker compose -p "$PROJECT_NAME" -f docker-compose.prod.yaml pull
          docker compose -p "$PROJECT_NAME" -f docker-compose.prod.yaml up -d --remove-orphans

      - name: Cleanup old images
        run: docker image prune --filter "until=24h" -f
