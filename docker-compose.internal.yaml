services:
  mathkb-app:
    image: ghcr.io/koshikai/koshikai:latest
    container_name: mathkb-app
    restart: always
    command:
      [
        "/bin/sh",
        "-c",
        "export MATHKB_DATABASE_URL=\"$${MATHKB_APP_DATABASE_URL:-$${MATHKB_DATABASE_URL:-}}\"; exec node server.js",
      ]
    ports:
      - "3103:3000"
    env_file:
      - .env.mathkb
    environment:
      - NODE_ENV=production
      - SITE_VARIANT=mathkb
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mathkb-mcp:
    image: ghcr.io/koshikai/koshikai-mcp:latest
    container_name: mathkb-mcp
    restart: always
    command:
      [
        "/bin/sh",
        "-c",
        "export MATHKB_DATABASE_URL=\"$${MCP_DATABASE_URL:-$${MATHKB_DATABASE_URL:-}}\"; exec bun run mcp:http",
      ]
    ports:
      - "3104:3004"
    env_file:
      - .env.mathkb
    environment:
      - NODE_ENV=production
      - MCP_BIND_HOST=0.0.0.0
      - MCP_PORT=3004
      - MCP_PATH=/mcp
      - MATHKB_POOL_MAX=3
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3004/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mathkb-nocodb:
    image: nocodb/nocodb:latest
    container_name: mathkb-nocodb
    restart: always
    ports:
      - "8180:8080"
    env_file:
      - .env.mathkb
    environment:
      - NC_DISABLE_TELE=true
      - NC_MIN=true
    volumes:
      - nocodb-data:/usr/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  nocodb-data:
