services:
  app:
    image: ghcr.io/koshikai/koshikai:latest
    container_name: koshikai-app
    restart: always
    ports:
      - "3002:3000"
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
      - SITE_URL=https://koshikai.dev
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/healthz', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
