<svg xmlns="http://www.w3.org/2000/svg" width="850px" height="650px" viewBox="0 0 850 650">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff8000" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- External Section -->
  <g transform="translate(375, 20)">
    <ellipse cx="50" cy="30" rx="60" ry="30" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />
    <text x="50" y="35" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Internet</text>
  </g>

  <!-- Home Router -->
  <g transform="translate(365, 110)">
    <rect width="120" height="45" rx="5" fill="#f5f5f5" stroke="#666666" stroke-width="1.5" />
    <text x="60" y="22" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">Router / GW</text>
    <text x="60" y="38" text-anchor="middle" font-family="Arial" font-size="10" fill="#d32f2f" font-weight="bold">192.168.1.1</text>
  </g>

  <!-- Proxmox Node Section -->
  <g transform="translate(40, 200)">
    <rect width="380" height="420" rx="10" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="5,5" />
    <rect width="380" height="30" rx="10" fill="#333" />
    <text x="190" y="20" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">Proxmox VE (Ryzen 7 5825U)</text>
    <text x="370" y="20" text-anchor="end" font-family="Arial" font-size="10" fill="#fff">Host: .1.10</text>

    <!-- Entry Proxy -->
    <g transform="translate(110, 50)">
      <rect width="160" height="55" rx="5" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" />
      <text x="80" y="20" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">Nginx Proxy Manager</text>
      <text x="80" y="35" text-anchor="middle" font-family="Arial" font-size="10" fill="#005a00">Port 80/443</text>
      <text x="80" y="48" text-anchor="middle" font-family="Arial" font-size="10" fill="#d32f2f" font-weight="bold">192.168.1.11</text>
    </g>

    <!-- DNS / Security -->
    <g transform="translate(30, 125)">
      <rect width="140" height="50" rx="5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" />
      <text x="70" y="18" text-anchor="middle" font-family="Arial" font-size="11">AdGuard Home</text>
      <text x="70" y="31" text-anchor="middle" font-family="Arial" font-size="9" fill="#0000ff">DNS (53)</text>
      <text x="70" y="44" text-anchor="middle" font-family="Arial" font-size="10" fill="#d32f2f" font-weight="bold">192.168.1.12</text>
    </g>

    <!-- Monitoring -->
    <g transform="translate(210, 125)">
      <rect width="140" height="50" rx="5" fill="#f8cecc" stroke="#b85450" stroke-width="1.2" />
      <text x="70" y="18" text-anchor="middle" font-family="Arial" font-size="11">Uptime Kuma</text>
      <text x="70" y="31" text-anchor="middle" font-family="Arial" font-size="9" fill="#990000">Monitoring</text>
      <text x="70" y="44" text-anchor="middle" font-family="Arial" font-size="10" fill="#d32f2f" font-weight="bold">192.168.1.14</text>
    </g>

    <!-- Immich Stack (LXC) -->
    <g transform="translate(30, 195)">
      <rect width="320" height="135" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5" />
      <text x="160" y="20" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">Immich Core Stack</text>
      <text x="310" y="20" text-anchor="end" font-family="Arial" font-size="10" fill="#cc3300" font-weight="bold">192.168.1.13</text>
      
      <rect x="20" y="35" width="130" height="40" rx="3" fill="#ffffff" stroke="#d6b656" />
      <text x="85" y="58" text-anchor="middle" font-family="Arial" font-size="10">Immich Server</text>

      <rect x="170" y="35" width="130" height="40" rx="3" fill="#ffffff" stroke="#d6b656" />
      <text x="235" y="58" text-anchor="middle" font-family="Arial" font-size="10">Microservices</text>

      <rect x="20" y="85" width="80" height="35" rx="3" fill="#ffffff" stroke="#d6b656" />
      <text x="60" y="107" text-anchor="middle" font-family="Arial" font-size="9">Redis</text>

      <rect x="110" y="85" width="100" height="35" rx="3" fill="#ffffff" stroke="#d6b656" />
      <text x="160" y="107" text-anchor="middle" font-family="Arial" font-size="9">Typesense</text>
    </g>

    <!-- Database -->
    <g transform="translate(130, 350)">
      <path d="M 0 10 C 0 0 120 0 120 10 L 120 50 C 120 60 0 60 0 50 Z" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5" />
      <path d="M 0 10 C 0 20 120 20 120 10" fill="none" stroke="#9673a6" stroke-width="1.5" />
      <text x="60" y="35" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">PostgreSQL</text>
      <text x="60" y="48" text-anchor="middle" font-family="Arial" font-size="9" fill="#4b0082">LXC Interface</text>
    </g>
  </g>

  <!-- Windows Main Machine Section -->
  <g transform="translate(460, 200)">
    <rect width="350" height="420" rx="10" fill="none" stroke="#004c99" stroke-width="2" stroke-dasharray="5,5" />
    <rect width="350" height="30" rx="10" fill="#004c99" />
    <text x="175" y="20" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">Windows Main PC (Static IP)</text>
    <text x="340" y="20" text-anchor="end" font-family="Arial" font-size="10" fill="#fff" font-weight="bold">192.168.1.100</text>

    <!-- Docker Desktop Container -->
    <g transform="translate(40, 60)">
      <rect width="270" height="150" rx="10" fill="#ffffff" stroke="#0099cc" stroke-width="1.5" stroke-dasharray="4,2" />
      <text x="135" y="25" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#0099cc">Docker Desktop (WSL2)</text>
      
      <rect x="35" y="45" width="200" height="85" rx="5" fill="#ffe6cc" stroke="#d79b00" stroke-width="2" />
      <text x="135" y="65" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Immich ML</text>
      <text x="135" y="85" text-anchor="middle" font-family="Arial" font-size="10">Endpoint: 3003</text>
      <text x="135" y="105" text-anchor="middle" font-family="Arial" font-size="10" fill="#cc3300" font-weight="bold">CUDA Accelerated</text>
    </g>

    <!-- Hardware Layer -->
    <g transform="translate(75, 290)">
      <rect width="200" height="100" rx="5" fill="#f8cecc" stroke="#b85450" stroke-width="2" />
      <text x="100" y="30" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">RTX 30 Series</text>
      <text x="100" y="55" text-anchor="middle" font-family="Arial" font-size="10">8GB VRAM</text>
    </g>
  </g>

  <!-- Connectors / Lines -->
  <g fill="none" stroke="#666" stroke-width="1.2">
    <!-- Router to NPM -->
    <path d="M 365 132 L 230 132 L 230 250" marker-end="url(#arrowhead)" />
    
    <!-- Distributed ML Link (Critical Path) -->
    <path d="M 350 435 L 535 435 L 535 315" stroke="#ff8000" stroke-width="2.5" marker-end="url(#arrowhead-orange)" />
    <rect x="380" y="420" width="140" height="30" rx="5" fill="#fff" stroke="#ff8000" stroke-width="1.5" />
    <text x="450" y="438" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#ff8000">192.168.1.100:3003</text>
  </g>

</svg>